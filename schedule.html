<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#8f2f3a"><title>日程 · mako's learning</title><link rel="stylesheet" href="styles.css?v=20260829"><script defer src="vendor/lucide.min.js"></script><script defer src="vendor/ical.min.js"></script><script type="module" src="js/schedule-page.js?v=20260829"></script></head>
<body data-page="schedule"><main class="workspace"><section class="page-heading compact"><div><span class="eyebrow">SEMESTER TIMELINE</span><h1>课程表与重要日期</h1><p class="page-lead">所有时间按北京时间显示，支持手动录入和标准 ICS 日历导入。</p></div><div class="heading-actions"><input id="icsInput" class="visually-hidden" type="file" accept=".ics,text/calendar"><button id="importIcsButton" class="secondary-action"><i data-lucide="upload"></i>导入 ICS</button><button id="addEventButton" class="primary-action"><i data-lucide="plus"></i>添加日程</button></div></section>
  <section class="schedule-grid"><section class="panel week-panel"><div class="panel-head"><div><span class="eyebrow">WEEK VIEW</span><h2 id="weekTitle">本周</h2></div><div class="week-controls"><button id="previousWeek" class="icon-btn" aria-label="上一周"><i data-lucide="chevron-left"></i></button><button id="currentWeek" class="secondary-action">本周</button><button id="nextWeek" class="icon-btn" aria-label="下一周"><i data-lucide="chevron-right"></i></button></div></div><div id="weekCalendar" class="week-calendar"></div></section><aside class="panel agenda-side"><div class="panel-head"><div><span class="eyebrow">UPCOMING</span><h2>近期日程</h2></div></div><div id="upcomingEvents" class="agenda-list"></div></aside></section></main>
  <dialog id="eventDialog" class="app-dialog form-dialog"><form id="eventForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">EVENT EDITOR</span><h2 id="eventDialogTitle">添加日程</h2></div><button class="icon-btn" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><input id="eventId" type="hidden"><div class="form-grid"><label class="span-2">标题<input id="eventTitle" required></label><label>课程<select id="eventCourse"></select></label><label>地点<input id="eventLocation"></label><label>开始时间<input id="eventStart" type="datetime-local" required></label><label>结束时间<input id="eventEnd" type="datetime-local" required></label><label class="span-2 check-label"><input id="eventWeekly" type="checkbox">每周重复至学期结束</label></div><div class="dialog-actions"><button id="deleteEventButton" class="danger-button hidden" type="button"><i data-lucide="trash-2"></i>删除</button><span class="action-spacer"></span><button class="secondary-action" type="button" data-close-dialog>取消</button><button class="primary-action" type="submit"><i data-lucide="save"></i>保存</button></div></form></dialog>
  <dialog id="icsResultDialog" class="app-dialog"><div class="dialog-head"><div><span class="eyebrow">IMPORT RESULT</span><h2>ICS 导入结果</h2></div><button class="icon-btn" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><div id="icsResult"></div></dialog>
  </body></html>
