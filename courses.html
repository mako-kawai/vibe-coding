<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#8f2f3a">
  <title>课程 · mako's learning</title><link rel="stylesheet" href="styles.css?v=20260730"><script defer src="vendor/lucide.min.js"></script><script type="module" src="js/courses-page.js"></script>
</head>
<body data-page="courses">
  <main class="workspace"><section class="page-heading compact"><div><span class="eyebrow">COURSE LIBRARY</span><h1>课程工作区</h1><p class="page-lead">从课程进入相关任务、推导笔记、课表与正式成绩。</p></div><button id="addCourseButton" class="primary-action" type="button"><i data-lucide="plus"></i>添加课程</button></section>
    <section class="toolbar"><div class="segmented" id="courseStatusFilters"><button class="active" data-status="active">本学期</button><button data-status="all">全部</button><button data-status="completed">已完成</button></div><input id="courseSearch" type="search" placeholder="搜索课程、代码或分类"></section>
    <section id="courseGrid" class="course-grid"></section></main>
  <dialog id="courseDialog" class="app-dialog form-dialog"><form id="courseForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">COURSE EDITOR</span><h2 id="courseDialogTitle">添加课程</h2></div><button class="icon-btn" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><input id="courseId" type="hidden"><div class="form-grid"><label class="span-2">课程名称<input id="courseName" required></label><label>课程代码<input id="courseCode"></label><label>学分<input id="courseCreditsInput" type="number" min="0" step="0.5" value="4"></label><label>分类<input id="courseCategory"></label><label>状态<select id="courseStatus"><option value="active">本学期</option><option value="planned">计划修读</option><option value="completed">已完成</option></select></label><label>强调色<input id="courseColor" type="color" value="#b5474d"></label><label>资料页面<input id="courseResource" placeholder="pdf/example.html"></label><label class="span-2">课程说明<textarea id="courseDescription" rows="3"></textarea></label></div><div class="dialog-actions"><button id="deleteCourseButton" class="danger-button hidden" type="button"><i data-lucide="trash-2"></i>删除</button><span class="action-spacer"></span><button class="secondary-action" type="button" data-close-dialog>取消</button><button class="primary-action" type="submit"><i data-lucide="save"></i>保存</button></div></form></dialog>
  <dialog id="courseOverviewDialog" class="app-dialog course-overview-dialog"><div class="dialog-head"><div><span class="eyebrow">COURSE OVERVIEW</span><h2 id="overviewCourseName">课程概览</h2></div><button class="icon-btn" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><div id="courseOverviewContent" class="course-overview-content"></div></dialog>
</body></html>
